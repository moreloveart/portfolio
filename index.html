        body {

            padding: 0;

        .liquid-glass {
            background: rgba(255,255,255,0.01);

            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: none;

            position: relative;
            overflow: hidden;
        }
        .liquid-glass::before {
            content: "";
            position: absolute; inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.45) 0%,
                rgba(255,255,255,0.15) 20%,
                rgba(255,255,255,0) 40%,
                rgba(255,255,255,0) 60%,
                rgba(255,255,255,0.15) 80%,
                rgba(255,255,255,0.45) 100%);

            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .liquid-glass-strong {
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
            position: relative;
            border: none;
        }
        .liquid-glass-strong::before {
            content: "";
            position: absolute; inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.5) 0%,
                rgba(255,255,255,0.2) 20%,
                rgba(255,255,255,0) 40%,
                rgba(255,255,255,0) 60%,
                rgba(255,255,255,0.2) 80%,
                rgba(255,255,255,0.5) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;

    <script type="text/babel">
        // Suppress specific React list key warnings as requested
        const originalConsoleError = console.error;
        console.error = (...args) => {
            if (typeof args[0] === 'string' && args[0].includes('Each child in a list should have a unique "key" prop')) return;

        };

        const GlobalMotion = window.Motion || window.FramerMotion;
        const { motion, useInView } = GlobalMotion;
        const { useEffect, useRef, useState } = React;

        // --- Icons ---

        const UsersIcon = ({ className = "w-7 h-7" }) => (

        const ChartIcon = ({ className = "w-7 h-7" }) => (

                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
        );

        const PhoneIcon = ({ className = "w-4 h-4" }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
        );

        // --- Gemini AI Integration ---
        const callGemini = async (prompt) => {
            const apiKey = "";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const systemPrompt = "Bạn là chuyên gia tư vấn phân tích dữ liệu (SPSS, AMOS, SmartPLS). Người dùng sẽ đưa ra câu hỏi nghiên cứu hoặc đề tài. Nhiệm vụ của bạn là: 1. Gợi ý phương pháp phân tích thống kê phù hợp (như Hồi quy, SEM, EFA, CFA). 2. Khuyên dùng phần mềm nào. Trả lời ngắn gọn, súc tích, chuyên nghiệp bằng tiếng Việt. Không dùng markdown phức tạp, chỉ dùng gạch đầu dòng cơ bản bằng dấu '-'. Cuối cùng khuyên họ liên hệ dịch vụ để được hỗ trợ chi tiết.";

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            let retries = 5;
            let delay = 1000;
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error('API failed');
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "Không thể phân tích yêu cầu này.";
                } catch (error) {
                    if (i === retries - 1) return "Lỗi kết nối AI. Vui lòng thử lại sau.";
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
        };

        const AIAdvisorModal = ({ isOpen, onClose }) => {
            const [input, setInput] = useState("");
            const [result, setResult] = useState("");
            const [loading, setLoading] = useState(false);

            if (!isOpen) return null;

            const handleAsk = async () => {
                if (!input.trim()) return;
                setLoading(true);
                setResult("");
                const response = await callGemini(input);
                setResult(response);
                setLoading(false);
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                    <motion.div
                        initial={{ opacity: 0, scale: 0.95 }}
                        animate={{ opacity: 1, scale: 1 }}
                        exit={{ opacity: 0, scale: 0.95 }}
                        className="liquid-glass-strong rounded-3xl w-full max-w-lg p-6 flex flex-col gap-4 border border-white/10"
                    >
                        <div className="flex justify-between items-center">
                            <h3 className="font-heading italic text-2xl text-white">✨ Trợ Lý AI Phân Tích</h3>
                            <button onClick={onClose} className="text-white/60 hover:text-white text-xl leading-none">✕</button>
                        </div>
                        <p className="text-sm text-white/70 font-body">Nhập tên đề tài hoặc mục tiêu nghiên cứu của bạn, AI sẽ gợi ý phương pháp và phần mềm phân tích tối ưu nhất.</p>
                        <textarea
                            value={input}
                            onChange={(e) => setInput(e.target.value)}

                        />
                        <button
                            onClick={handleAsk}
                            disabled={loading}
                            className="bg-white text-black font-medium text-sm py-3 rounded-xl hover:bg-gray-200 transition-colors flex justify-center items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                            {loading ? "Đang phân tích..." : "✨ Tư Vấn Cho Tôi"}
                        </button>
                        {result && (
                            <div className="mt-2 p-4 bg-white/5 rounded-xl border border-white/10 overflow-y-auto max-h-48">
                                <p className="text-sm text-white/90 whitespace-pre-wrap font-body leading-relaxed">{result}</p>
                            </div>
                        )}
                    </motion.div>
                </div>
            );
        };

        // --- Components ---

        const FadingVideo = ({ src, className, style }) => {
            const videoRef = useRef(null);
            const fadingOutRef = useRef(false);
            const rafIdRef = useRef(null);
            
            const FADE_MS = 500;
            const FADE_OUT_LEAD = 0.55;

            const fadeTo = (targetOpacity, durationMs) => {
                if (rafIdRef.current) cancelAnimationFrame(rafIdRef.current);
                
                const vid = videoRef.current;
                if (!vid) return;

                const startOpacity = parseFloat(vid.style.opacity || 0);
                const startTime = performance.now();

                const step = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / durationMs, 1);
                    vid.style.opacity = startOpacity + (targetOpacity - startOpacity) * progress;

                    if (progress < 1) {
                        rafIdRef.current = requestAnimationFrame(step);
                    }
                };
                rafIdRef.current = requestAnimationFrame(step);
            };

            useEffect(() => {
                const vid = videoRef.current;
                if (!vid) return;

                const handleLoadedData = () => {
                    vid.style.opacity = 0;
                    vid.play().catch(e => console.log("Autoplay prevented", e));
                    fadeTo(1, FADE_MS);
                };

                const handleTimeUpdate = () => {
                    if (!vid.duration) return;
                    const timeRemaining = vid.duration - vid.currentTime;
                    
                    if (timeRemaining <= FADE_OUT_LEAD && timeRemaining > 0 && !fadingOutRef.current) {
                        fadingOutRef.current = true;
                        fadeTo(0, FADE_MS);
                    }
                };

                const handleEnded = () => {
                    vid.style.opacity = 0;
                    setTimeout(() => {
                        if(!vid) return;
                        vid.currentTime = 0;
                        vid.play().catch(e => console.log("Play prevented", e));
                        fadingOutRef.current = false;
                        fadeTo(1, FADE_MS);
                    }, 100);
                };

                vid.addEventListener('loadeddata', handleLoadedData);
                vid.addEventListener('timeupdate', handleTimeUpdate);
                vid.addEventListener('ended', handleEnded);

                return () => {
                    if (rafIdRef.current) cancelAnimationFrame(rafIdRef.current);
                    vid.removeEventListener('loadeddata', handleLoadedData);
                    vid.removeEventListener('timeupdate', handleTimeUpdate);
                    vid.removeEventListener('ended', handleEnded);
                };
            }, []);

            return (
                <video 
                    ref={videoRef}
                    src={src}
                    className={className}
                    style={{ ...style, opacity: 0, transition: 'none' }}
                    autoPlay 
                    muted 
                    playsInline 
                    preload="auto"
                />
            );
        };

        const BlurText = ({ text, className }) => {
            const containerRef = useRef(null);
            const isInView = useInView(containerRef, { once: true, amount: 0.1 });
            const words = text.split(" ");

            return (
                <p 
                    ref={containerRef}
                    className={className}
                    style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', rowGap: '0.1em' }}
                >
                    {words.map((word, i) => (
                        <motion.span
                            key={i}
                            initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
                            animate={isInView ? { 
                                filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'], 
                                opacity: [0, 0.5, 1], 
                                y: [50, -5, 0] 
                            } : {}}
                            transition={{
                                duration: 0.7,
                                times: [0, 0.5, 1],
                                ease: "easeOut",
                                delay: (i * 100) / 1000
                            }}
                            style={{ display: 'inline-block', marginRight: '0.28em' }}

                            {word}
                        </motion.span>
                    ))}

        const HeroSection = ({ onOpenAI }) => {

            return (
                <section className="relative h-screen bg-black overflow-hidden flex flex-col">
                    <FadingVideo 
                        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_080021_d598092b-c4c2-4e53-8e46-94cf9064cd50.mp4"
                        className="absolute left-1/2 top-0 -translate-x-1/2 object-cover object-top z-0"
                        style={{ width: "120%", height: "120%" }}
                    />
                    
                    <div className="relative z-10 flex-1 flex flex-col items-center pt-32 px-4 justify-center">
                        <motion.div 
                            initial={baseInitial}
                            animate={{ filter: "blur(0px)", opacity: 1, y: 0 }}
                            transition={{ duration: 0.8, ease: "easeOut", delay: 0.4 }}

                            <span className="bg-white text-black px-3 py-1 text-xs font-semibold rounded-full">Mới</span>

                        <BlurText

                        <motion.p

                            Phân tích dữ liệu SPSS · AMOS · SmartPLS · Tableau · Power BI. Setup Office 2016–365 và thiết kế slide Canva chuyên nghiệp — nhanh chóng, uy tín, dễ hiểu.
                        </motion.p>

                        <motion.div

                        <motion.div

                            <div className="liquid-glass rounded-[1.25rem] p-5 w-[220px] flex flex-col justify-between">
                                <UsersIcon className="w-7 h-7 text-white/80 mb-4" />
                                <div>
                                    <h4 className="font-heading italic text-white text-4xl tracking-[-1px] leading-none">500+</h4>
                                    <p className="text-xs text-white/70 font-body font-light mt-1">Khách hàng đã hỗ trợ</p>
                                </div>

                                <ChartIcon className="w-7 h-7 text-white/80 mb-4" />
                                <div>
                                    <h4 className="font-heading italic text-white text-4xl tracking-[-1px] leading-none">5</h4>

                                </div>

                    <motion.div 
                        initial={baseInitial}
                        animate={{ filter: "blur(0px)", opacity: 1, y: 0 }}
                        transition={{ duration: 0.8, ease: "easeOut", delay: 1.4 }}
                        className="relative z-10 flex flex-col items-center gap-5 pb-12 pt-8 w-full bg-gradient-to-t from-black/40 to-transparent"
                    >
                        <div className="liquid-glass rounded-full px-4 py-1.5 text-xs font-medium text-white/90 font-body">
                            Hỗ trợ đầy đủ các phần mềm phân tích & văn phòng hàng đầu
                        </div>
                        <div className="flex flex-wrap justify-center font-heading italic text-white/80 text-2xl md:text-3xl tracking-tight gap-x-8 md:gap-x-12 gap-y-4 px-4 text-center">
                            <span>SPSS</span>
                            <span className="opacity-40">·</span>
                            <span>AMOS</span>
                            <span className="opacity-40">·</span>
                            <span>SmartPLS</span>
                            <span className="opacity-40">·</span>
                            <span>Tableau</span>
                            <span className="opacity-40">·</span>
                            <span>Power BI</span>
                            <span className="opacity-40">·</span>
                            <span>Canva</span>
                        </div>
                    </motion.div>
                </section>
            );
        };

        const CapabilityCard = ({ iconPath, tags, title, body }) => (
            <div className="liquid-glass rounded-[1.25rem] p-6 md:p-8 min-h-[360px] flex flex-col group hover:bg-white/5 transition-colors duration-500">
                <div className="flex items-start justify-between gap-4 mb-8">
                    <div className="w-11 h-11 liquid-glass rounded-[0.75rem] flex items-center justify-center">

                    </div>

        const CapabilitiesSection = () => {
            return (
                <section className="relative min-h-screen bg-black w-full flex flex-col">
                    <FadingVideo 
                        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_094631_d30ab262-45ee-4b7d-99f3-5d5848c8ef13.mp4"
                        className="absolute inset-0 w-full h-full object-cover z-0"
                    />
                    
                    <div className="relative z-10 px-6 md:px-16 lg:px-20 pt-24 pb-32 flex flex-col flex-1">
                        <div className="mb-auto">
                            <motion.p 
                                initial={{ opacity: 0, y: 10 }}
                                whileInView={{ opacity: 1, y: 0 }}
                                viewport={{ once: true }}
                                transition={{ duration: 0.6 }}
                                className="text-sm font-body text-white/80 mb-4 tracking-wide uppercase"
                            >
                                // Dịch Vụ
                            </motion.p>
                            <motion.h2 
                                initial={{ opacity: 0, filter: "blur(10px)", y: 20 }}

                                viewport={{ once: true }}
                                transition={{ duration: 0.8, delay: 0.1 }}

                            >

        const ParticleCanvas = () => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext("2d");
                let animId;
                let W, H;

                // --- Particles ---
                const PARTICLE_COUNT = 90;
                const particles = [];

                const resize = () => {
                    W = canvas.width = canvas.offsetWidth;
                    H = canvas.height = canvas.offsetHeight;
                };

                const rand = (min, max) => Math.random() * (max - min) + min;

                const initParticles = () => {
                    particles.length = 0;
                    for (let i = 0; i < PARTICLE_COUNT; i++) {
                        particles.push({
                            x: rand(0, W),
                            y: rand(0, H),
                            r: rand(0.4, 1.8),
                            vx: rand(-0.15, 0.15),
                            vy: rand(-0.25, -0.05),
                            alpha: rand(0.1, 0.6),
                            alphaDir: rand(-0.003, 0.003),
                        });
                    }
                };

                // --- Flowing lines (data streams) ---
                const LINE_COUNT = 7;
                const lines = [];

                const initLines = () => {
                    lines.length = 0;
                    for (let i = 0; i < LINE_COUNT; i++) {
                        lines.push({
                            x: rand(0, W),
                            y: rand(-H, H),
                            speed: rand(0.4, 1.0),
                            length: rand(80, 220),
                            alpha: rand(0.04, 0.12),
                            width: rand(0.5, 1.2),
                        });
                    }
                };

                // --- Aurora blobs ---
                let t = 0;
                const blobs = [
                    { cx: 0.25, cy: 0.45, rx: 0.35, ry: 0.25, color: "rgba(30,80,180,0.055)", speed: 0.00035 },
                    { cx: 0.72, cy: 0.55, rx: 0.30, ry: 0.20, color: "rgba(80,30,160,0.045)", speed: 0.00045 },
                    { cx: 0.50, cy: 0.30, rx: 0.40, ry: 0.18, color: "rgba(20,120,120,0.038)", speed: 0.00028 },
                ];

                resize();
                initParticles();
                initLines();

                const draw = () => {
                    t++;
                    ctx.clearRect(0, 0, W, H);

                    // Dark base
                    ctx.fillStyle = "#000";
                    ctx.fillRect(0, 0, W, H);

                    // Aurora blobs
                    blobs.forEach((b, i) => {
                        const ox = Math.sin(t * b.speed + i * 2.1) * 0.08;
                        const oy = Math.cos(t * b.speed * 1.3 + i * 1.7) * 0.06;
                        const gx = (b.cx + ox) * W;
                        const gy = (b.cy + oy) * H;
                        const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, b.rx * W);
                        grad.addColorStop(0, b.color);
                        grad.addColorStop(1, "transparent");
                        ctx.fillStyle = grad;
                        ctx.fillRect(0, 0, W, H);
                    });

                    // Flowing data lines (vertical streaks)
                    lines.forEach(l => {
                        l.y += l.speed;
                        if (l.y > H + l.length) {
                            l.y = -l.length;
                            l.x = rand(0, W);
                        }
                        const grad = ctx.createLinearGradient(l.x, l.y - l.length, l.x, l.y);
                        grad.addColorStop(0, `rgba(255,255,255,0)`);
                        grad.addColorStop(0.5, `rgba(255,255,255,${l.alpha})`);
                        grad.addColorStop(1, `rgba(255,255,255,0)`);
                        ctx.beginPath();
                        ctx.strokeStyle = grad;
                        ctx.lineWidth = l.width;
                        ctx.moveTo(l.x, l.y - l.length);
                        ctx.lineTo(l.x, l.y);
                        ctx.stroke();
                    });

                    // Particles (floating dust)
                    particles.forEach(p => {
                        p.x += p.vx + Math.sin(t * 0.008 + p.y * 0.01) * 0.08;
                        p.y += p.vy;
                        p.alpha += p.alphaDir;
                        if (p.alpha <= 0.05 || p.alpha >= 0.65) p.alphaDir *= -1;
                        if (p.y < -5) { p.y = H + 5; p.x = rand(0, W); }
                        if (p.x < -5) p.x = W + 5;
                        if (p.x > W + 5) p.x = -5;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255,255,255,${p.alpha})`;
                        ctx.fill();
                    });

                    // Subtle grid lines
                    ctx.strokeStyle = "rgba(255,255,255,0.018)";
                    ctx.lineWidth = 0.5;
                    const GRID = 80;
                    for (let x = 0; x < W; x += GRID) {
                        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
                    }
                    for (let y = 0; y < H; y += GRID) {
                        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
                    }

                    // Centre glow vignette
                    const vg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.65);
                    vg.addColorStop(0, "rgba(255,255,255,0.025)");
                    vg.addColorStop(1, "transparent");
                    ctx.fillStyle = vg;
                    ctx.fillRect(0, 0, W, H);

                    animId = requestAnimationFrame(draw);
                };

                const ro = new ResizeObserver(() => { resize(); initLines(); });
                ro.observe(canvas);
                draw();

                return () => {
                    cancelAnimationFrame(animId);
                    ro.disconnect();
                };
            }, []);

            return (
                <canvas
                    ref={canvasRef}
                    className="absolute inset-0 w-full h-full"
                    style={{ display: "block" }}
                />
            );
        };

                const BUBBLE_COUNT = 18;
                const bubbles = [];
                const rand = (a, b) => Math.random() * (b - a) + a;

                const initBubbles = () => {
                    bubbles.length = 0;
                    for (let i = 0; i < BUBBLE_COUNT; i++) {
                        bubbles.push({
                            x: rand(0, W), y: rand(0, H),

                            wobble: rand(0, Math.PI * 2),

                        });
                    }
                };

                resize();
                initBubbles();

                const draw = () => {
                    t++;
                    ctx.clearRect(0, 0, W, H);

                    // Dark base
                    ctx.fillStyle = "#050508";
                    ctx.fillRect(0, 0, W, H);

                    auroraBlobs.forEach((b) => {

                        const gy = (b.cy + oy) * H;
                        const radius = b.rx * W;
                        const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, radius);
                        const pulse = 0.06 + 0.025 * Math.sin(t * b.speed * 3 + b.phase);
                        grad.addColorStop(0, `rgba(${b.r},${b.g},${b.b},${pulse})`);
                        grad.addColorStop(0.4, `rgba(${b.r},${b.g},${b.b},${pulse * 0.5})`);
                        grad.addColorStop(1, `rgba(${b.r},${b.g},${b.b},0)`);
                        ctx.fillStyle = grad;
                        ctx.fillRect(0, 0, W, H);
                    });

                    // Floating iridescent bubbles
                    bubbles.forEach(p => {
                        p.x += p.vx + Math.sin(t * p.wobbleSpeed + p.wobble) * 0.3;
                        p.y += p.vy;
                        p.hue = (p.hue + p.hueSpeed) % 360;
                        if (p.y + p.r < -10) { p.y = H + p.r; p.x = rand(0, W); }
                        if (p.x < -p.r * 2) p.x = W + p.r;
                        if (p.x > W + p.r * 2) p.x = -p.r;

                        // Bubble body — radial gradient for glass look
                        const bg = ctx.createRadialGradient(p.x - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.05, p.x, p.y, p.r);
                        bg.addColorStop(0, `hsla(${p.hue},100%,85%,${p.alpha * 0.6})`);

                        bg.addColorStop(1, `hsla(${(p.hue + 120) % 360},100%,40%,0)`);
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = bg;
                        ctx.fill();

                        // Bubble rim
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.strokeStyle = `hsla(${p.hue},100%,80%,${p.alpha * 1.2})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();

                        // Highlight glint
                        ctx.beginPath();
                        ctx.arc(p.x - p.r * 0.3, p.y - p.r * 0.32, p.r * 0.18, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255,255,255,${p.alpha * 0.9})`;
                        ctx.fill();
                    });

                    // Subtle noise overlay for depth
                    ctx.fillStyle = "rgba(0,0,0,0.08)";
                    ctx.fillRect(0, 0, W, H);

                    animId = requestAnimationFrame(draw);
                };

                const ro = new ResizeObserver(() => { resize(); initBubbles(); });
                ro.observe(canvas);
                draw();

                return () => { cancelAnimationFrame(animId); ro.disconnect(); };
            }, []);

            return (
                <canvas
                    ref={canvasRef}
                    className="absolute inset-0 w-full h-full"
                    style={{ display: "block" }}
                />
            );
        };

                    const text = data.content?.find(b => b.type === "text")?.text || "Không thể phân tích yêu cầu này.";
                    setAiAnswer(text);
                } catch (e) {
                    setAiAnswer("Lỗi kết nối AI. Vui lòng thử lại sau.");

                setAiLoading(false);

            return (
                <section className="relative bg-black w-full flex flex-col items-center px-6 py-24 overflow-hidden">
                    <AuroraBubbleCanvas />
                    <div className="relative z-10 max-w-3xl w-full flex flex-col gap-10">

                            </div>
                            {aiAnswer && (
